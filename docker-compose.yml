services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      # LLM-generated SQL only ever runs as the read-only role.
      DATABASE_URL: postgresql+psycopg://analytics_ro:analytics_ro@db:5432/analytics
      TRACE_DATABASE_URL: postgresql+psycopg://app_logger:app_logger@db:5432/analytics
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # One-shot: docker compose --profile tools run --rm seed
  seed:
    build: .
    profiles: ["tools"]
    command: ["python", "-m", "scripts.seed"]
    environment:
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@db:5432/analytics
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
